[project]
name = "observability-demo"
version = "0.1.0"
description = "Demo tag-3/01: the T2/04 service instrumented with OTel GenAI spans, exported to Langfuse"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "fastapi[standard]>=0.115",
    "neo4j>=5.28",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[bedrock-runtime]>=1.35",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
