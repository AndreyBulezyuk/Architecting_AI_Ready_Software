[project]
name = "evaluation-demo"
version = "0.1.0"
description = "Demo tag-3/02: score the T2/02 Vector-RAG baseline with Ragas (Faithfulness, Context Precision/Recall) against Bedrock"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "instructor[bedrock]>=1.15.4",
    # ragas 0.4.3's import of ragas.llms.base breaks against langchain-community>=0.4
    # (removed langchain_community.chat_models.vertexai) — verified bug, see
    # https://github.com/vibrantlabsai/ragas/issues/2745
    "langchain-community<0.4",
    "neo4j>=5.28",
    "pydantic-settings>=2.6",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[bedrock-runtime]>=1.35",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
