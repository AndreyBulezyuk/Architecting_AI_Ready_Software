[project]
name = "setup-aws-loesung"
version = "0.1.0"
description = "Solution for exercise tag-1/03: ParticipantStack (CDK) and first Bedrock call"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170",
    "boto3>=1.35",
    "constructs>=10.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[bedrock-runtime]>=1.43.40",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
