[project]
name = "document-store-demo"
version = "0.1.0"
description = "Demo tag-1/05: S3 raw text + Postgres/pgvector with a full embedding lifecycle"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[s3]>=1.35",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
