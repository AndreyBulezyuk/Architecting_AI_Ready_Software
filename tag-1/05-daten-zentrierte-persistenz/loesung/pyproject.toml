[project]
name = "document-store-loesung"
version = "0.1.0"
description = "Solution tag-1/05: event-driven re-embedding + EXPLAIN proof for the HNSW index"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "boto3-stubs[s3,sqs]>=1.43.40",
    "botocore[crt]>=1.35",
    "neo4j>=5.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[s3,sqs]>=1.35",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
