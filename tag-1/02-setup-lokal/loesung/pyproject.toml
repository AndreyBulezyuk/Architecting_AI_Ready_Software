[project]
name = "setup-lokal-loesung"
version = "0.1.0"
description = "Solution for exercise tag-1/02: DynamoDB and Neo4j (vector index + graph) against the local stack"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "neo4j>=5.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[dynamodb]>=1.43.40",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
