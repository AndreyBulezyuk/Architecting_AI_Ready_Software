[project]
name = "stack-smoke"
version = "0.1.0"
description = "Smoke tests proving the local training stack is up (demo, tag-1/02)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "neo4j>=5.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "boto3-stubs[s3]>=1.43.40",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
