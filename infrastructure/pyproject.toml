[project]
name = "training-infrastructure"
version = "0.1.0"
description = "AWS CDK app for the training — stacks grow chapter by chapter"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
